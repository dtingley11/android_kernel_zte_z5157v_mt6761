name: Build kernel variant

on:
  workflow_call:
    outputs:
      kernel_revision:
        description: Resolved stock kernel revision
        value: ${{ jobs.build.outputs.kernel_revision }}
    inputs:
      kernel_ref:
        default: main
        type: string
      variant:
        required: true
        type: string
      ksu_ref:
        default: legacy
        type: string
      anykernel_ref:
        default: master
        type: string
      susfs_ref:
        default: kernel-4.9-v2
        type: string
      manager_config:
        default: ''
        type: string
      stock_uname:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      kernel_revision: ${{ steps.prepare.outputs.kernel_revision }}
    env:
      KERNEL_REF: ${{ inputs.kernel_ref }}
      VARIANT: ${{ inputs.variant }}
      KSU_REF: ${{ inputs.ksu_ref }}
      SUSFS_REF: ${{ inputs.susfs_ref }}
      ANYKERNEL_REF: ${{ inputs.anykernel_ref }}
      MANAGER_CONFIG: ${{ inputs.manager_config }}
      STOCK_UNAME: ${{ inputs.stock_uname }}
    steps:
      - name: Set build directory
        run: echo "BUILD_WORK=$RUNNER_TEMP/z5157v-$VARIANT" >> "$GITHUB_ENV"

      - name: Check out device kernel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare sources and apply patches
        id: prepare
        run: >-
          python3 ci/build.py prepare --variant "$VARIANT" --work "$BUILD_WORK"
          --kernel-ref "$KERNEL_REF" --ksu-ref "$KSU_REF" --susfs-ref "$SUSFS_REF"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev libncurses-dev python-is-python3

      - name: Build kernel and modules
        run: |
          manager_args=()
          if [ -n "$MANAGER_CONFIG" ]; then
            manager_args+=(--manager-config "$MANAGER_CONFIG")
          fi
          if [ "$STOCK_UNAME" = true ]; then
            manager_args+=(--stock-uname)
          fi
          python3 ci/build.py build --variant "$VARIANT" --work "$BUILD_WORK" "${manager_args[@]}"

      - name: Package with AnyKernel3
        run: >-
          python3 ci/package.py --variant "$VARIANT" --work "$BUILD_WORK"
          --anykernel-ref "$ANYKERNEL_REF"

      - name: Write build summary
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 ci/build.py summary --variant "$VARIANT" --work "$BUILD_WORK"

      - name: Upload kernel or failure report
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: z5157v-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_WORK }}/reports/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
